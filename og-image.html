<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 800px; height: 1000px; overflow: hidden;
      background: #F7EDE0;
      font-family: 'Poppins', sans-serif;
    }
    #canvas-area {
      width: 800px; height: 1000px;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      width: 420px;
      background: #fff;
      border: 3px solid #1a1008;
      box-shadow: 8px 10px 0 #a08060;
      display: flex;
      flex-direction: column;
    }
    .lot-number {
      font-size: 14px;
      font-style: italic;
      font-weight: 500;
      color: #1a1008;
      padding: 8px 10px 8px;
    }
    .top-line-wrap { padding: 0 10px; }
    .top-line {
      height: 5px;
      background: linear-gradient(to bottom, #8FC9B9 0px, #8FC9B9 3px, #1a1008 3px, #1a1008 5px);
    }
    .photo-box {
      margin: 0 10px 0;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-top: 2px solid #1a1008;
      border-bottom: 2px solid #1a1008;
    }
    .photo-box img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .band-box {
      background: #8FC9B9;
      border-top: 2px solid #1a1008;
      margin: 0 10px 40px;
      padding: 7px 16px 9px;
      text-align: center;
    }
    .band-name {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .band-sub {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 1px;
      margin-top: 6px;
    }

    #export-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1a1008;
      color: #F7EDE0;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-weight: 600;
      border: none;
      padding: 10px 18px;
      cursor: pointer;
      letter-spacing: 1px;
      z-index: 999;
    }
    #export-btn:hover { background: #8FC9B9; color: #1a1008; }
  </style>
</head>
<body>
  <div id="canvas-area">
    <div class="card">
      <div class="lot-number">71-76</div>
      <div class="top-line-wrap"><div class="top-line"></div></div>
      <div class="photo-box">
        <img src="assets/og.png" alt="El Bosque" />
      </div>
      <div class="band-box">
        <div class="band-name">EL BOSQUE</div>
        <div class="band-sub">ver más →</div>
      </div>
    </div>
  </div>

  <button id="export-btn">↓ Export PNG</button>

  <script>
    document.getElementById('export-btn').addEventListener('click', async () => {
      const btn = document.getElementById('export-btn');
      btn.style.display = 'none';
      const canvas = await html2canvas(document.getElementById('canvas-area'), {
        width: 800,
        height: 1000,
        scale: 2,
        useCORS: true,
        backgroundColor: '#F7EDE0'
      });
      btn.style.display = '';
      const link = document.createElement('a');
      link.download = 'og-el-bosque.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
